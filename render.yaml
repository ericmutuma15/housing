services:
  - type: web
    name: housing-backend
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        scope: runtime
      - key: SECRET_KEY
        scope: runtime
      - key: ALGORITHM
        value: HS256
